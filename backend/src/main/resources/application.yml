spring:
  application:
    name: budget-book-backend

  datasource:
    url: jdbc:h2:file:./data/mybudget_codex;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      continue-on-error: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 18080

app:
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET:budget-book-codex-local-dev-secret-change-me-2026}
    token-hours: 24

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: DEBUG
    com.mybudget.backend: DEBUG
